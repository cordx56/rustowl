name: Build RustOwl

on:
  push:
    branches: ["main"]
  pull_request:
    types: ["labeled"]
  workflow_dispatch:
  workflow_call:
    outputs:
      run_id:
        description: Run ID of this workflow
        value: ${{ github.run_id }}
env:
  CARGO_TERM_COLOR: always

jobs:
  rustowl:
    if: github.event.action != 'labeled' || github.event.label.name == 'do-build-check'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Using fat LTO causes failure to link on Windows
      - name: Set build profile
        run: |
          if [[ "${{ matrix.os }}" == windows* ]]; then
            echo "build_profile=windows-release" >> $GITHUB_ENV
          else
            echo "build_profile=release" >> $GITHUB_ENV
          fi

      # uname on Windows on ARM returns "x86_64"
      - name: Set ARCH flag for Windows on ARM
        if: matrix.os == 'windows-11-arm'
        run: echo "TOOLCHAIN_ARCH=aarch64" >> $GITHUB_ENV

      - name: setup env
        run: |
          host_tuple="$(./scripts/toolchain /bin/bash -c 'echo $HOST_TUPLE')"
          echo "host_tuple=$host_tuple" >> $GITHUB_ENV
          toolchain="$(./scripts/toolchain /bin/bash -c 'echo $RUSTOWL_TOOLCHAIN')"
          echo "toolchain=$toolchain" >> $GITHUB_ENV

          ([[ "$host_tuple" == *msvc* ]] && echo "exec_ext=.exe" || echo "exec_ext=") >> $GITHUB_ENV
          ([[ "$host_tuple" == *windows* ]] && echo "is_windows=true" || echo "is_windows=false") >> $GITHUB_ENV
          ([[ "$host_tuple" == *linux* ]] && echo "is_linux=true" || echo "is_linux=false") >> $GITHUB_ENV

      - name: Install zig
        if: ${{ env.is_linux == 'true' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Build
        run: |
          if [[ "${is_linux}" == "true" ]]; then
            ./scripts/toolchain cargo install --locked cargo-zigbuild
            ./scripts/toolchain cargo zigbuild --target ${host_tuple}.2.17 --profile=${build_profile}
          else
            ./scripts/toolchain cargo build --target ${host_tuple} --profile=${build_profile}
          fi

      - name: Check the functionality
        run: |
          ./target/${host_tuple}/${build_profile}/rustowl${exec_ext} check ./perf-tests/dummy-package

      - name: Set archive name
        run: |
          if [[ "${is_windows}" == "true" ]]; then
            echo "archive_name=rustowl-${host_tuple}.zip" >> $GITHUB_ENV
          else
            echo "archive_name=rustowl-${host_tuple}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Setup archive artifacts
        run: |
          rm -rf rustowl && mkdir -p rustowl/sysroot/${toolchain}/bin

          cp target/${host_tuple}/${build_profile}/rustowl${exec_ext} ./rustowl/
          cp target/${host_tuple}/${build_profile}/rustowlc${exec_ext} ./rustowl/

          cp README.md ./rustowl
          cp LICENSE ./rustowl

          find target -type d | grep -E 'rustowl-build-time-out$' | xargs -I % cp -r % ./
          cp -r rustowl-build-time-out/completions ./rustowl
          cp -r rustowl-build-time-out/man ./rustowl

          rm -rf ${archive_name}

          if [[ "${is_windows}" == "true" ]]; then
            powershell -c 'Compress-Archive -Path "rustowl/" -DestinationPath ".\${archive_name}" -CompressionLevel Optimal'
          else
            cd rustowl
            tar -czvf ../${archive_name} README.md LICENSE sysroot/ rustowlc${exec_ext} completions/ man/ rustowl${exec_ext}
            cd ..
          fi

          cp ./rustowl/rustowl${exec_ext} ./rustowl-${host_tuple}${exec_ext}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustowl-runtime-${{ env.host_tuple }}
          path: |
            rustowl-${{ env.host_tuple }}${{ env.exec_ext }}
            ${{ env.archive_name }}

  vscode:
    if: github.event.action != 'labeled' || github.event.label.name == 'do-build-check'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup PNPM And Install dependencies
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ./vscode/package.json
          run_install: |
            - cwd: ./vscode

      - name: Create VSIX
        run: pnpm build
        working-directory: ./vscode

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustowl-vscode
          path: vscode/**/*.vsix
