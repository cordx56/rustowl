name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1

jobs:
  define-matrix:
    name: Define supported Rust toolchains
    runs-on: ubuntu-latest
    outputs:
      toolchains: ${{ steps.toolchains.outputs.toolchains }}
      latest: ${{ steps.toolchains.outputs.latest }}
    steps:
      - id: toolchains
        run: |
          TOOLCHAINS='["1.94.1", "1.95.0", "1.96.0", "1.97.0", "1.98.1"]'
          echo "toolchains=$TOOLCHAINS" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.[-1]' <<< "$TOOLCHAINS")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    needs:
      - define-matrix
    strategy:
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ needs.define-matrix.outputs.latest }}
          components: clippy,llvm-tools,rust-src,rustc-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: define-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ needs.define-matrix.outputs.latest }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    needs:
      - define-matrix

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        toolchain: ${{ fromJSON(needs.define-matrix.outputs.toolchains) }}
        os:
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm

    env:
      TOOLCHAIN_CHANNEL: ${{ matrix.toolchain }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Using fat LTO causes failure to link on Windows
      - name: Set build profile
        run: |
          if [[ "${{ matrix.os }}" == windows* ]]; then
            echo "build_profile=windows-release" >> $GITHUB_ENV
          else
            echo "build_profile=release" >> $GITHUB_ENV
          fi

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      # uname on Windows on ARM returns "x86_64"
      - name: Set ARCH flag for Windows on ARM
        if: matrix.os == 'windows-11-arm'
        run: echo "TOOLCHAIN_ARCH=aarch64" >> $GITHUB_ENV

      - name: Build release
        run: ./scripts/toolchain cargo build --profile=${build_profile}

      - name: Run tests
        # MIR is still unstable, so this test can fail in other versions of Rust.
        #
        # This result differ by target platform, so only check on Linux.
        # Note: Whether the check success or not is checked by `rustowl check`.
        if: matrix.toolchain == needs.define-matrix.outputs.latest && matrix.os == 'ubuntu-latest'
        run: ./scripts/toolchain cargo nextest run --no-fail-fast

      - name: Install binary
        run: ./scripts/toolchain cargo install --path crates/rustowl --profile=${build_profile}

      - name: Test rustowl check
        run: rustowl check ./crates/rustowl/perf-tests/dummy-package

  vscode:
    name: VS Code Extension Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM And Install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          working-directory: ./vscode

      - name: Check formatting
        run: pnpm prettier -c src
        working-directory: ./vscode

      - name: Lint and type check
        run: pnpm lint && pnpm check-types
        working-directory: ./vscode

      - name: Run tests
        run: xvfb-run -a pnpm run test
        working-directory: ./vscode
