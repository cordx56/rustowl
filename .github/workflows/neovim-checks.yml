name: NeoVim Checks

on:
  pull_request:
    paths:
      - lua/**/*
      - ftplugin/**/*
      - .luacheckrc
      - .stylua.toml
      - selene.toml
      - vim.yml
      - nvim-tests/**/*
      - scripts/run_nvim_tests.sh
      - .github/workflows/neovim-checks.yml
  push:
    branches:
      - main
    paths:
      - lua/**/*
      - ftplugin/**/*
      - .luacheckrc
      - .stylua.toml
      - selene.toml
      - vim.yml
      - nvim-tests/**/*
      - scripts/run_nvim_tests.sh
      - .github/workflows/neovim-checks.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.11.2

      - name: Setup RustOwl
        run: |
          ./scripts/toolchain cargo build --release
          ./scripts/toolchain cargo install --path .

      - name: Run Tests
        run: ./scripts/run_nvim_tests.sh

  style:
    name: Check Styling Using Stylua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Stylua
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  lint:
    name: Lint Code Using Selene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Lua code with Selene
        uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
        with:
          config-path: "selene.toml"
          working-directory: "."
          report-as-annotations: "true"
