name: Security & Memory Safety

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1

jobs:
  cargo-deny:
    name: Dependency Policy (cargo-deny)
    # cargo-deny is OS-independent, so this runs once rather than once per matrix
    # entry. The matrix job below passes --no-audit so the two do not duplicate
    # each other's work.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./Cargo.toml
          command: check
          # Graph settings (all-features) live in deny.toml so that a local
          # `cargo deny check` and this job evaluate exactly the same thing.
          log-level: warn

  thread-sanitizer:
    name: ThreadSanitizer
    # A dedicated job rather than a step in the OS matrix: ThreadSanitizer needs a
    # nightly toolchain and only works on Linux, and rebuilding std under the
    # sanitizer is expensive enough that it should run once with a warm cache.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-src is required by -Zbuild-std, which rebuilds std with the
          # sanitizer so the crate ABI matches.
          components: rust-src,rustc-dev,llvm-tools-preview
          cache: false

      - name: Cache the sanitizer build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tsan
          key: tsan-${{ hashFiles('Cargo.lock') }}
          restore-keys: tsan-

      - name: Run ThreadSanitizer
        shell: bash
        env:
          # Keep the instrumented build out of the default target dir so it does
          # not thrash the cache of any other job.
          CARGO_TARGET_DIR: target/tsan
        run: |
          if ! ./scripts/security.sh \
            --thread-sanitizer \
            --no-miri \
            --no-valgrind \
            --no-audit \
            --no-cargo-shear \
            --no-instruments; then
            echo "::error::ThreadSanitizer reported issues"
            exit 1
          fi

      - name: Upload ThreadSanitizer logs (on failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsan-logs-${{ github.run_id }}
          path: security-logs/
          retention-days: 7

  security-checks:
    name: Security & Memory Safety Analysis
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            runner_os: Linux
          - os: ubuntu-24.04-arm
            runner_os: Linux
          - os: macos-latest
            runner_os: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: miri,rust-src,llvm-tools-preview,rustc-dev
          cache: false

      - name: Install system dependencies (Linux)
        if: matrix.runner_os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Make scripts executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x scripts/*.sh

      - name: Run comprehensive security checks
        shell: bash
        run: |
          # The security script auto-detects CI and installs missing tools.
          # --no-audit because the cargo-deny job already covers the
          # vulnerability check, and resolving the full dependency graph is
          # wasteful to repeat on every OS. ThreadSanitizer has its own job.
          if ! ./scripts/security.sh --no-audit; then
            echo "::error::Security tests failed"
            exit 1
          fi

      - name: Create security summary and cleanup
        if: failure()
        shell: bash
        run: |
          # Only create summary and cleanup on failure
          echo "Security tests failed, creating summary..."

          # The security script should have created its own summary
          if [ -f "security-logs/security_summary_*.md" ]; then
            echo "Security script summary found:"
            ls -la security-logs/security_summary_*.md
            echo "::error::Security test failures detected. Check the summary for details."
          else
            echo "Warning: Security script summary not found, creating fallback summary"
            mkdir -p security-logs
            echo "# Security Testing Summary (Failure)" > security-logs/failure-summary.txt
            echo "Generated: $(date)" >> security-logs/failure-summary.txt
            echo "OS: ${{ matrix.os }}" >> security-logs/failure-summary.txt
            echo "Status: Security tests failed" >> security-logs/failure-summary.txt
            echo "::error::Security tests failed and no detailed summary was found"
          fi

          # List all generated logs for debugging
          if [ -d "security-logs" ]; then
            echo "Available security logs:"
            ls -la security-logs/
            echo "Total log directory size: $(du -sh security-logs 2>/dev/null | cut -f1 || echo 'N/A')"
          fi

      - name: Cleanup build artifacts (on success)
        if: success()
        shell: bash
        run: |
          echo "Security tests passed! Cleaning up build artifacts..."
          # Remove security logs on success to save space
          if [ -d "security-logs" ]; then
            echo "Removing security logs (tests passed)"
            rm -rf security-logs/
          fi

      - name: Upload security artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            security-logs/
            *.trace
            DrMemory-*.log
            drmemory.*.log
            instruments_output*.trace
          retention-days: 7
