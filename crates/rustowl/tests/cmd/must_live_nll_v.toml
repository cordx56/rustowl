bin = { name = "rustowl" }
args = ["show", "--path", "must_live.rs", "nll", "v"]
env = { inherit = true, add = { NO_COLOR = "1" } }
fs = { base = "../fixtures", sandbox = true }
status = "success"
stdout = '''

=== Variable 'v' (1/1) in function 'nll' ===

 114 | // NLL accepts this because `first` is dead before the mutable borrow (compiles).
 115 | fn nll() {
 116 |     let mut v = vec![1];
     |         -----   -------
 117 |     let first = &v[0];
     |         -----    - --
 118 |     println!("{first}");
     |     -------------------
 119 |     v.push(2);
     |     - --------
 120 | }
     | -
 121 | 
 122 | // A borrow held by a struct and used through another reference (compiles).

Legend:
  --- definitely live (lifetime)
  ~~~ maybe live
  --- immutable borrow
  --- mutable borrow
  --- move / call
  ~~~ outlive / shared mutable
'''
